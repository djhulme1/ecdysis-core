name: Deploy

# Every push to main deploys to STAGING first, then to PRODUCTION
# (docs/ENVIRONMENTS.md). The production job runs in the GitHub environment
# "production": once the owner gives that environment a required reviewer
# (Settings → Environments → production), every production deploy waits for
# their approval, and nothing a merge does can reach the record of science
# by itself. Until then the job runs as it always did, straight after the
# staging job passes. Both jobs skip gracefully, with a note in the summary,
# while their Cloudflare resources are not yet configured.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  staging:
    name: Staging
    runs-on: ubuntu-24.04
    outputs:
      deployed: ${{ steps.deploy.outputs.deployed }}
      url: ${{ steps.deploy.outputs.url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # The staging record's own database and public keys, set by the Staging workflow (staging.yml) when it provisions or
      # resets the record; patched into [env.staging] of wrangler.toml at deploy time, as production's operator key is.
      STAGING_D1_ID: ${{ vars.STAGING_D1_ID }}
      STAGING_STH_PUBLIC_KEY: ${{ vars.STAGING_STH_PUBLIC_KEY }}
      STAGING_OPERATOR_PUBLIC_KEY: ${{ vars.STAGING_OPERATOR_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Gate on configuration
        id: gate
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare secrets not set: skipping the staging deploy." >> "$GITHUB_STEP_SUMMARY"
          elif [ -z "$STAGING_D1_ID" ] || [ -z "$STAGING_STH_PUBLIC_KEY" ] || [ -z "$STAGING_OPERATOR_PUBLIC_KEY" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Staging is not provisioned (no STAGING_D1_ID, STAGING_STH_PUBLIC_KEY and STAGING_OPERATOR_PUBLIC_KEY variables): skipping it. Run the Staging workflow once to provision it (docs/ENVIRONMENTS.md)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Patch the staging placeholders
        if: steps.gate.outputs.ready == 'true'
        run: |
          sed -i "s/REPLACE_WITH_STAGING_D1_ID/$STAGING_D1_ID/; s/REPLACE_WITH_STAGING_STH_PUBLIC_KEY/$STAGING_STH_PUBLIC_KEY/; s/REPLACE_WITH_STAGING_OPERATOR_PUBLIC_KEY/$STAGING_OPERATOR_PUBLIC_KEY/" wrangler.toml
          if grep -q 'REPLACE_WITH_STAGING' wrangler.toml; then echo "::error::a staging placeholder survived the patch"; exit 1; fi

      - name: Apply any new migrations to the staging database
        if: steps.gate.outputs.ready == 'true'
        run: npx wrangler d1 migrations apply DB --env staging --remote

      - name: Deploy to staging
        id: deploy
        if: steps.gate.outputs.ready == 'true'
        shell: bash
        run: |
          npx wrangler deploy --env staging | tee /tmp/deploy.log
          URL=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' /tmp/deploy.log | head -1)
          echo "deployed=true" >> "$GITHUB_OUTPUT"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Staging deployed: ${URL:-no workers.dev address in the deploy output}" >> "$GITHUB_STEP_SUMMARY"

      - name: Install the staging door key (when configured)
        if: steps.gate.outputs.ready == 'true'
        # The door's shared key (docs/ENVIRONMENTS.md § The staging door): a repository secret, installed on the staging
        # Worker alone; piped, never echoed. Without it the door stays closed and staging takes no sign-ins.
        env:
          STAGING_DOOR_KEY: ${{ secrets.STAGING_DOOR_KEY }}
        shell: bash
        run: |
          if [ -n "$STAGING_DOOR_KEY" ]; then
            printf '%s' "$STAGING_DOOR_KEY" | npx wrangler secret put STAGING_DOOR_KEY --env staging > /dev/null
            echo "Staging door key installed." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No STAGING_DOOR_KEY secret: the staging door is closed (nobody can sign in on staging)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Check staging (read mode)
        if: steps.gate.outputs.ready == 'true' && steps.deploy.outputs.url != ''
        # The same probes production gets nightly, against the staging record and its own log key. A failure here stops
        # the production job: what broke staging never ships.
        env:
          ECDYSIS_URL: ${{ steps.deploy.outputs.url }}
          STH_PUBLIC_KEY: ${{ vars.STAGING_STH_PUBLIC_KEY }}
          MODE: read
        shell: bash
        run: |
          sleep 5
          node --import tsx scripts/live-check.ts | tee /tmp/staging-check.log
          echo '## Staging check' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/staging-check.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  production:
    name: Production
    needs: staging
    # The one gate that matters: a required reviewer on this environment (the owner's to set) holds every production
    # deploy for a tap of approval. The job also waits for the staging job, which fails when staging broke.
    environment: production
    runs-on: ubuntu-24.04
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # The database id and the log's public key are pinned in wrangler.toml
      # (the fresh start of 5 Oct 2026); only the operator key's public half
      # comes from a repository variable.
      OPERATOR_PUBLIC_KEY: ${{ vars.OPERATOR_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Gate on configuration
        id: gate
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare secrets not set — skipping deploy. Add them and run the Provision workflow first." >> "$GITHUB_STEP_SUMMARY"
          elif grep -q 'REPLACE_WITH_YOUR_D1\|REPLACE_WITH_YOUR_STH' wrangler.toml; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Not provisioned: wrangler.toml still has a placeholder for the database or the log key. See docs/deploy.md." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.ready == 'true'
        with:
          python-version: "3.12"
      - name: Python for the signing code /connect gives
        # The deploy runs CI's tests, and GitHub sets CI in every workflow, so test/connect.test.ts runs the page's Python
        # signing code here too: without these two packages the tests fail and nothing ships (6 Oct 2026: #70 and #71).
        if: steps.gate.outputs.ready == 'true'
        run: python -m pip install rfc8785==0.1.4 "cryptography>=42"

      - name: Tests must pass before anything ships
        if: steps.gate.outputs.ready == 'true'
        # The spec reporter for the log, and a TAP copy for the step below, as CI does.
        run: npm run test:ci && npm run typecheck
      - name: Name the failing tests as annotations
        # When the gate fails, the failing test's assertion and location are on the run itself; a flake names itself.
        if: failure() && hashFiles('test.tap') != ''
        run: node scripts/ci-annotate.mjs test.tap

      - name: Patch wrangler.toml with the operator key
        if: steps.gate.outputs.ready == 'true'
        run: |
          if [ -n "$OPERATOR_PUBLIC_KEY" ]; then
            sed -i "s/REPLACE_WITH_YOUR_OPERATOR_PUBLIC_KEY/$OPERATOR_PUBLIC_KEY/" wrangler.toml
          fi

      - name: Apply any new migrations
        if: steps.gate.outputs.ready == 'true'
        # By binding, so the step follows whichever database wrangler.toml
        # pins (a fresh start changes the database, never this line).
        run: npx wrangler d1 migrations apply DB --remote

      - name: Deploy
        if: steps.gate.outputs.ready == 'true'
        # shell: bash turns on pipefail, so a wrangler failure fails the step
        # even through the tee. Without it, "upload ok but no URL to publish
        # to" (e.g. no workers.dev subdomain registered) showed green.
        shell: bash
        run: npx wrangler deploy | tee /tmp/deploy.log

      - name: Install the email provider's key (when configured)
        if: steps.gate.outputs.ready == 'true'
        # The key lives only in GitHub secrets and the Worker's secret store;
        # it is piped, never echoed. Without it, email sending stays off.
        env:
          HERALD_API_KEY: ${{ secrets.HERALD_API_KEY }}
        shell: bash
        run: |
          if [ -n "$HERALD_API_KEY" ]; then
            printf '%s' "$HERALD_API_KEY" | npx wrangler secret put HERALD_API_KEY > /dev/null
            echo "Email provider key installed." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No HERALD_API_KEY secret: email sending stays off." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Install the stakes scout's OpenAlex key (when configured)
        if: steps.gate.outputs.ready == 'true'
        # A free key gives the scout its own daily budget; without it OpenAlex
        # answers 429 once everyone behind the Worker's shared IP has spent the
        # free one. Piped, never echoed. Without it, sources are still observed
        # where OpenAlex allows, and the field totals may not be.
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        shell: bash
        run: |
          if [ -n "$OPENALEX_API_KEY" ]; then
            printf '%s' "$OPENALEX_API_KEY" | npx wrangler secret put OPENALEX_API_KEY > /dev/null
            echo "OpenAlex key installed." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No OPENALEX_API_KEY secret: the stakes scout uses OpenAlex's shared free budget." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Install the context writer's model key (when configured)
        if: steps.gate.outputs.ready == 'true'
        # context/0.1: the key the archive uses to write "What this means" on
        # each claim page. It lives only in GitHub secrets and the Worker's
        # secret store; piped, never echoed. Without it no summary is written,
        # and the claim pages still show each paper's record from OpenAlex.
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        shell: bash
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            printf '%s' "$ANTHROPIC_API_KEY" | npx wrangler secret put ANTHROPIC_API_KEY > /dev/null
            echo "Context writer's key installed." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No ANTHROPIC_API_KEY secret: no summaries are written; the papers' records still are." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Check production, and roll back if it fails
        if: steps.gate.outputs.ready == 'true'
        # The nightly probes, run at once against the record of science: a deploy that fails them is rolled back to the
        # previous version before anyone notices, and the job fails loudly so the merge is looked at.
        env:
          ECDYSIS_URL: https://api.ecdysis.me
          MODE: read
        shell: bash
        run: |
          sleep 8
          if node --import tsx scripts/live-check.ts | tee /tmp/live-check.log; then
            echo '## Production check: passed' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '## Production check: FAILED — rolled back to the previous version' >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/live-check.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            npx wrangler rollback --yes --message "Deploy ${GITHUB_SHA::7} failed the live check" || echo "::error::rollback failed; check the dashboard"
            exit 1
          fi
