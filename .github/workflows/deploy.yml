name: Deploy

# Deploys on every push to main once secrets and variables are configured
# (see provision.yml). Without them, the job skips gracefully instead of
# failing, so CI stays readable before Cloudflare is connected.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
      STH_PUBLIC_KEY: ${{ vars.STH_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Gate on configuration
        id: gate
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare secrets not set — skipping deploy. Add them and run the Provision workflow first." >> "$GITHUB_STEP_SUMMARY"
          elif [ -z "$D1_DATABASE_ID" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Repository variable D1_DATABASE_ID not set — run the Provision workflow and save its outputs as variables." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Tests must pass before anything ships
        if: steps.gate.outputs.ready == 'true'
        run: npm test && npm run typecheck

      - name: Patch wrangler.toml with this deployment's ids
        if: steps.gate.outputs.ready == 'true'
        run: |
          sed -i "s/REPLACE_WITH_YOUR_D1_ID/$D1_DATABASE_ID/" wrangler.toml
          if [ -n "$STH_PUBLIC_KEY" ]; then
            sed -i "s/REPLACE_WITH_YOUR_STH_PUBLIC_KEY/$STH_PUBLIC_KEY/" wrangler.toml
          fi

      - name: Apply any new migrations
        if: steps.gate.outputs.ready == 'true'
        run: npx wrangler d1 migrations apply ecdysis --remote

      - name: Deploy
        if: steps.gate.outputs.ready == 'true'
        run: npx wrangler deploy | tee /tmp/deploy.log

      - name: Smoke test the live API
        if: steps.gate.outputs.ready == 'true'
        run: |
          URL=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' /tmp/deploy.log | head -1)
          if [ -z "$URL" ]; then
            echo "Could not find a workers.dev URL in the deploy output (custom domain?). Skipping smoke test." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          sleep 5
          echo "Live at: $URL" >> "$GITHUB_STEP_SUMMARY"
          curl -fsS "$URL/" | head -c 400
          echo
          curl -fsS "$URL/v1/log/sth" | head -c 400
          echo
          echo "Smoke test passed: / and /v1/log/sth answered." >> "$GITHUB_STEP_SUMMARY"
