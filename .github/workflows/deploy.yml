name: Deploy

# Deploys on every push to main once secrets and variables are configured
# (see provision.yml). Without them, the job skips gracefully instead of
# failing, so CI stays readable before Cloudflare is connected.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # The database id and the log's public key are pinned in wrangler.toml
      # (the fresh start of 5 Oct 2026); only the operator key's public half
      # comes from a repository variable.
      OPERATOR_PUBLIC_KEY: ${{ vars.OPERATOR_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Gate on configuration
        id: gate
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare secrets not set — skipping deploy. Add them and run the Provision workflow first." >> "$GITHUB_STEP_SUMMARY"
          elif grep -q 'REPLACE_WITH_YOUR_D1\|REPLACE_WITH_YOUR_STH' wrangler.toml; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Not provisioned: wrangler.toml still has a placeholder for the database or the log key. See docs/deploy.md." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.ready == 'true'
        with:
          python-version: "3.12"
      - name: Python for the signing code /connect gives
        # The deploy runs CI's tests, and GitHub sets CI in every workflow, so test/connect.test.ts runs the page's Python
        # signing code here too: without these two packages the tests fail and nothing ships (6 Oct 2026: #70 and #71).
        if: steps.gate.outputs.ready == 'true'
        run: python -m pip install rfc8785==0.1.4 "cryptography>=42"

      - name: Tests must pass before anything ships
        if: steps.gate.outputs.ready == 'true'
        # The spec reporter for the log, and a TAP copy for the step below, as CI does.
        run: npm run test:ci && npm run typecheck
      - name: Name the failing tests as annotations
        # When the gate fails, the failing test's assertion and location are on the run itself; a flake names itself.
        if: failure() && hashFiles('test.tap') != ''
        run: node scripts/ci-annotate.mjs test.tap

      - name: Patch wrangler.toml with the operator key
        if: steps.gate.outputs.ready == 'true'
        run: |
          if [ -n "$OPERATOR_PUBLIC_KEY" ]; then
            sed -i "s/REPLACE_WITH_YOUR_OPERATOR_PUBLIC_KEY/$OPERATOR_PUBLIC_KEY/" wrangler.toml
          fi

      - name: Apply any new migrations
        if: steps.gate.outputs.ready == 'true'
        # By binding, so the step follows whichever database wrangler.toml
        # pins (a fresh start changes the database, never this line).
        run: npx wrangler d1 migrations apply DB --remote

      - name: Deploy
        if: steps.gate.outputs.ready == 'true'
        # shell: bash turns on pipefail, so a wrangler failure fails the step
        # even through the tee. Without it, "upload ok but no URL to publish
        # to" (e.g. no workers.dev subdomain registered) showed green.
        shell: bash
        run: npx wrangler deploy | tee /tmp/deploy.log

      - name: Install the email provider's key (when configured)
        if: steps.gate.outputs.ready == 'true'
        # The key lives only in GitHub secrets and the Worker's secret store;
        # it is piped, never echoed. Without it, email sending stays off.
        env:
          HERALD_API_KEY: ${{ secrets.HERALD_API_KEY }}
        shell: bash
        run: |
          if [ -n "$HERALD_API_KEY" ]; then
            printf '%s' "$HERALD_API_KEY" | npx wrangler secret put HERALD_API_KEY > /dev/null
            echo "Email provider key installed." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No HERALD_API_KEY secret: email sending stays off." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Install the stakes scout's OpenAlex key (when configured)
        if: steps.gate.outputs.ready == 'true'
        # A free key gives the scout its own daily budget; without it OpenAlex
        # answers 429 once everyone behind the Worker's shared IP has spent the
        # free one. Piped, never echoed. Without it, sources are still observed
        # where OpenAlex allows, and the field totals may not be.
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        shell: bash
        run: |
          if [ -n "$OPENALEX_API_KEY" ]; then
            printf '%s' "$OPENALEX_API_KEY" | npx wrangler secret put OPENALEX_API_KEY > /dev/null
            echo "OpenAlex key installed." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No OPENALEX_API_KEY secret: the stakes scout uses OpenAlex's shared free budget." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Smoke test the live API
        if: steps.gate.outputs.ready == 'true'
        shell: bash
        run: |
          URL=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' /tmp/deploy.log | head -1)
          if [ -z "$URL" ]; then
            echo "Could not find a workers.dev URL in the deploy output (custom domain?). Skipping smoke test." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          sleep 5
          echo "Live at: $URL" >> "$GITHUB_STEP_SUMMARY"
          curl -fsS "$URL/" | head -c 400
          echo
          curl -fsS "$URL/v2/log/sth" | head -c 400
          echo
          echo "Smoke test passed: / and /v2/log/sth answered." >> "$GITHUB_STEP_SUMMARY"
