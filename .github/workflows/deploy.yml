name: Deploy

# Deploys on every push to main once secrets and variables are configured
# (see provision.yml). Without them, the job skips gracefully instead of
# failing, so CI stays readable before Cloudflare is connected.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # v2's database and log key (the switchover of 3 Oct 2026); the v1
      # values stay as D1_DATABASE_ID and STH_PUBLIC_KEY for the apps Worker
      # and the frozen archive.
      D1_V2_DATABASE_ID: ${{ vars.D1_V2_DATABASE_ID }}
      STH_V2_PUBLIC_KEY: ${{ vars.STH_V2_PUBLIC_KEY }}
      D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
      OPERATOR_PUBLIC_KEY: ${{ vars.OPERATOR_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Gate on configuration
        id: gate
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare secrets not set — skipping deploy. Add them and run the Provision workflow first." >> "$GITHUB_STEP_SUMMARY"
          elif grep -q 'REPLACE_WITH_YOUR_D1_V2_ID\|REPLACE_WITH_YOUR_STH_V2_PUBLIC_KEY' wrangler.toml && { [ -z "$D1_V2_DATABASE_ID" ] || [ -z "$STH_V2_PUBLIC_KEY" ]; }; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "v2 is not provisioned: wrangler.toml still has a placeholder and the repository variables D1_V2_DATABASE_ID / STH_V2_PUBLIC_KEY are not set. See docs/v2/SWITCHOVER.md." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Tests must pass before anything ships
        if: steps.gate.outputs.ready == 'true'
        run: npm test && npm run typecheck

      - name: Patch wrangler.toml with this deployment's ids
        if: steps.gate.outputs.ready == 'true'
        run: |
          # The real values are pinned in wrangler.toml since the switchover; the variables are a fallback for a deployment that keeps them out of the repository.
          if [ -n "$D1_V2_DATABASE_ID" ]; then sed -i "s/REPLACE_WITH_YOUR_D1_V2_ID/$D1_V2_DATABASE_ID/" wrangler.toml; fi
          if [ -n "$STH_V2_PUBLIC_KEY" ]; then sed -i "s|REPLACE_WITH_YOUR_STH_V2_PUBLIC_KEY|$STH_V2_PUBLIC_KEY|" wrangler.toml; fi
          if grep -q 'REPLACE_WITH_YOUR_D1_V2_ID\|REPLACE_WITH_YOUR_STH_V2_PUBLIC_KEY' wrangler.toml; then echo "::error::wrangler.toml still has a v2 placeholder"; exit 1; fi
          if [ -n "$OPERATOR_PUBLIC_KEY" ]; then
            sed -i "s/REPLACE_WITH_YOUR_OPERATOR_PUBLIC_KEY/$OPERATOR_PUBLIC_KEY/" wrangler.toml
          fi

      - name: Apply any new migrations
        if: steps.gate.outputs.ready == 'true'
        run: npx wrangler d1 migrations apply ecdysis-v2 --remote

      - name: Deploy
        if: steps.gate.outputs.ready == 'true'
        # shell: bash turns on pipefail, so a wrangler failure fails the step
        # even through the tee. Without it, "upload ok but no URL to publish
        # to" (e.g. no workers.dev subdomain registered) showed green.
        shell: bash
        run: npx wrangler deploy | tee /tmp/deploy.log

      - name: Install the Herald's email-provider key (when configured)
        if: steps.gate.outputs.ready == 'true'
        # The key lives only in GitHub secrets and the Worker's secret store;
        # it is piped, never echoed. Without it, email sending stays off.
        env:
          HERALD_API_KEY: ${{ secrets.HERALD_API_KEY }}
        shell: bash
        run: |
          if [ -n "$HERALD_API_KEY" ]; then
            printf '%s' "$HERALD_API_KEY" | npx wrangler secret put HERALD_API_KEY > /dev/null
            echo "Herald email-provider key installed." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No HERALD_API_KEY secret: email sending stays off." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Deploy the apps Worker (user-content domain)
        if: steps.gate.outputs.ready == 'true'
        # Separate step and allowed to fail without masking the core deploy:
        # attaching the *.ecdysis.app route needs zone permissions the
        # least-privilege CI token may lack; the summary says so if it does.
        continue-on-error: true
        shell: bash
        run: |
          # The apps Worker serves the v1 record's bundles: it stays on the v1 database.
          if [ -z "$D1_DATABASE_ID" ]; then echo "No D1_DATABASE_ID (v1): skipping the apps Worker." >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
          sed -i "s/REPLACE_WITH_YOUR_D1_ID/$D1_DATABASE_ID/" wrangler.apps.toml
          if npx wrangler deploy -c wrangler.apps.toml | tee /tmp/deploy-apps.log; then
            echo "Apps Worker deployed." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Apps Worker deploy failed (likely the *.ecdysis.app route needs zone permissions). Attach the route in the dashboard." >> /dev/stderr
            echo "Apps Worker deploy FAILED — see the log; the route may need attaching in the dashboard." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Smoke test the live API
        if: steps.gate.outputs.ready == 'true'
        shell: bash
        run: |
          URL=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' /tmp/deploy.log | head -1)
          if [ -z "$URL" ]; then
            echo "Could not find a workers.dev URL in the deploy output (custom domain?). Skipping smoke test." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          sleep 5
          echo "Live at: $URL" >> "$GITHUB_STEP_SUMMARY"
          curl -fsS "$URL/" | head -c 400
          echo
          curl -fsS "$URL/v1/log/sth" | head -c 400
          echo
          echo "Smoke test passed: / and /v1/log/sth answered." >> "$GITHUB_STEP_SUMMARY"
