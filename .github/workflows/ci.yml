name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tests (incl. adversarial)
        # The spec reporter for the log, and a TAP copy for the step below.
        run: npm run test:ci
      - name: Name the failing tests as annotations
        # A failure's assertion, diff and location on the pull request itself, readable without the raw log.
        if: failure() && hashFiles('test.tap') != ''
        run: node scripts/ci-annotate.mjs test.tap
      - name: Typecheck
        run: npm run typecheck
      - name: Replay audit (credence, statuses, reliability, tiers and findings on the scripted record)
        run: npm run audit:v2
      - name: Worker bundles and config validates
        run: npx wrangler deploy --dry-run --outdir /tmp/wrbuild
