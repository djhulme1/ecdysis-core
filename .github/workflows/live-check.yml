name: Live check

# Functional + non-functional probes against the deployed platform, and the
# nightly external mirror of the Signed Tree Head. The mirror is this repo's
# own copy of every verified head: if the live log ever rewrites history,
# the consistency check here fails loudly and the last honest head is in git.
#
# The mirror is kept on the branch `mirror`, not on `main` (from 10 November
# 2026): `main` takes changes only through reviewed pull requests, and a
# nightly commit by a workflow cannot pass that rule. Each run takes the
# latest mirror/ from that branch, checks the live head against it, and
# commits the new head back to it. mirror/ on `main` holds the heads up to
# the day the branch was made, and the exported earlier records.
#
# read mode: GET-only probes + offline signature/proof verification.
# full mode: additionally sends writes that must be refused (an unregistered
#            agent, a forged signature, an oversize body), so nothing is
#            ever added to the record.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "read (GET-only) or full (adds write-path probes)"
        required: true
        default: "read"
        type: choice
        options: [read, full]
  schedule:
    # Nightly read-mode probe + STH mirror. Odd minute on purpose.
    - cron: "43 3 * * *"

permissions:
  contents: write

concurrency:
  group: live-check
  cancel-in-progress: false

jobs:
  live-check:
    runs-on: ubuntu-24.04
    env:
      ECDYSIS_URL: https://api.ecdysis.me
      # The log key is read from its pin in wrangler.toml.
      MODE: ${{ inputs.mode || 'read' }}
      MIRROR: "1"
      # The network's log, from its genesis on 5 October 2026; the earlier
      # records are history under mirror/v1/ and mirror/v2/.
      MIRROR_FILE: mirror/network/sth-history.jsonl
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Take the mirror as it stands on its branch
        shell: bash
        run: |
          if git fetch --depth 1 origin mirror; then
            git checkout FETCH_HEAD -- mirror/
          else
            echo "No mirror branch yet: starting it from main's copy." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Probe the live platform
        shell: bash
        run: |
          node --import tsx scripts/live-check.ts | tee /tmp/live-check.log
          echo '## Live check ('"$MODE"' mode)' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/live-check.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Commit the mirrored tree head to the mirror branch
        shell: bash
        run: |
          # A worktree at the mirror branch's head (or at main's, the first time), given this run's mirror/ and pushed.
          if git fetch --depth 1 origin mirror; then BASE=FETCH_HEAD; else BASE=HEAD; fi
          WT="$RUNNER_TEMP/mirror-branch"
          git worktree add --detach "$WT" "$BASE" > /dev/null
          rm -rf "$WT/mirror"
          cp -a mirror "$WT/mirror"
          cd "$WT"
          if [ -z "$(git status --porcelain mirror/)" ]; then
            echo "Mirror unchanged." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "ecdysis-live-check"
          git config user.email "actions@users.noreply.github.com"
          git add mirror/
          git commit -q -m "mirror: verified signed tree head $(date -u +%FT%TZ)"
          git push origin HEAD:refs/heads/mirror
          echo "Mirrored a new verified tree head to the mirror branch." >> "$GITHUB_STEP_SUMMARY"
