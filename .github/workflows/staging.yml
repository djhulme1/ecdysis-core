name: Staging (provision or reset)

# Makes the staging record, or makes it afresh (docs/ENVIRONMENTS.md § Reset):
#
#   1. the staging database (ecdysis-staging), created if it does not exist, then WIPED;
#   2. new keys, made inside this runner and never printed: the log key, the
#      operator key (used once, below, for genesis, then gone) and the
#      accounts key;
#   3. the migrations, the deploy of the staging Worker, and its secrets in
#      one step: the private halves, the two public halves the Worker checks
#      itself against, and the door key when the STAGING_DOOR_KEY repository
#      secret exists. They live on the Worker from then on, so later deploys
#      and previews need nothing copied anywhere;
#   4. genesis: the constitution adopted under R2 with the operator key of
#      step 2, on a deployment that says it is staging (scripts/staging-genesis.ts
#      refuses any other);
#   5. optionally, a seed population through the staging door (harness/seed.ts);
#   6. the read-mode probes.
#
# Nothing here can touch production: every wrangler command runs with --env
# staging, the database is found by the name ecdysis-staging and refused if
# its id is production's, the wipe script refuses any other database, the
# genesis script refuses any deployment that does not say it is staging, and
# the production database, keys and secrets are never read. Run it as often
# as you like; type "reset" to confirm you mean to wipe the staging record.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "reset" to wipe the staging record and start it afresh'
        required: true
        type: string
      seed:
        description: "Populate the fresh record"
        required: true
        default: "seed"
        type: choice
        options: [seed, empty]

permissions:
  contents: read

concurrency:
  group: staging
  cancel-in-progress: false

jobs:
  reset:
    runs-on: ubuntu-24.04
    env:
      # Staging may live on a Cloudflare account of its own (docs/ENVIRONMENTS.md § Hardening).
      CLOUDFLARE_API_TOKEN: ${{ secrets.STAGING_CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.STAGING_CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Refuse without the word
        if: inputs.confirm != 'reset'
        run: |
          echo "::error::type \"reset\" in the confirm box to wipe the staging record"
          exit 1
      - name: Fail early if the Cloudflare secrets are missing
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are the repository secrets every deploy uses; add them first."
            exit 1
          fi

      - name: Where this run keeps its keys
        # The runner's own temporary directory, outside the checkout; removed before the run ends.
        run: echo "KEYS=$RUNNER_TEMP/staging-keys" >> "$GITHUB_ENV"

      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: The staging database (created once, kept across resets)
        run: node scripts/staging-config.mjs --create

      - name: New keys for the staging record, made here and never printed
        id: keys
        shell: bash
        run: |
          node --import tsx scripts/staging-keys.ts "$KEYS" > /dev/null
          for f in log.private operator.private accounts.key; do echo "::add-mask::$(cat "$KEYS/$f")"; done
          echo "log_pub=$(cat "$KEYS/log.public")" >> "$GITHUB_OUTPUT"
          echo "op_pub=$(cat "$KEYS/operator.public")" >> "$GITHUB_OUTPUT"

      - name: Wipe the staging record
        run: node scripts/staging-wipe.mjs

      - name: Lay the staging database out again
        run: npx wrangler d1 migrations apply DB --env staging --remote

      - name: Deploy the staging Worker
        id: deploy
        shell: bash
        run: |
          npx wrangler deploy --env staging | tee /tmp/deploy.log
          URL=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' /tmp/deploy.log | head -1)
          if [ -z "$URL" ]; then echo "::error::no workers.dev address in the deploy output (is the account's workers.dev subdomain registered? subdomain.yml)"; exit 1; fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Install the staging Worker's secrets, all at once
        env:
          STAGING_DOOR_KEY: ${{ secrets.STAGING_DOOR_KEY }}
        shell: bash
        run: |
          # One file, one deployment: the Worker never runs with a new private key beside an old public half.
          node -e '
            const fs = require("fs"); const d = process.env.KEYS; const r = (f) => fs.readFileSync(d + "/" + f, "utf8").trim();
            const s = { STH_SIGNING_KEY_PKCS8: r("log.private"), STH_PUBLIC_KEY: r("log.public"), OPERATOR_PUBLIC_KEY: r("operator.public"), ACCOUNTS_KEY: r("accounts.key") };
            if (process.env.STAGING_DOOR_KEY) s.STAGING_DOOR_KEY = process.env.STAGING_DOOR_KEY.trim();
            fs.writeFileSync(d + "/secrets.json", JSON.stringify(s), { mode: 0o600 });
          '
          npx wrangler secret bulk "$KEYS/secrets.json" --env staging > /dev/null
          rm -f "$KEYS/secrets.json"
          if [ -n "$STAGING_DOOR_KEY" ]; then echo "door=open" >> "$GITHUB_ENV"; else echo "door=closed (no STAGING_DOOR_KEY repository secret)" >> "$GITHUB_ENV"; fi

      - name: Genesis
        env:
          ECDYSIS_URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          export STAGING_OPERATOR_PRIVATE_KEY="$(cat "$KEYS/operator.private")"
          for i in 1 2 3 4 5 6; do
            if node --import tsx scripts/staging-genesis.ts; then exit 0; fi
            echo "not yet (the deploy may still be settling); waiting"; sleep 10
          done
          echo "::error::genesis did not succeed"; exit 1

      - name: Forget the private keys
        if: always()
        run: rm -rf "$KEYS"

      - name: Seed the record (through the staging door)
        if: inputs.seed == 'seed'
        env:
          ECDYSIS_URL: ${{ steps.deploy.outputs.url }}
          STAGING_DOOR_KEY: ${{ secrets.STAGING_DOOR_KEY }}
        shell: bash
        run: |
          if [ -z "$STAGING_DOOR_KEY" ]; then
            echo "No STAGING_DOOR_KEY secret: the record stays empty (the seed signs in through the door)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          node --import tsx harness/seed.ts | tee /tmp/seed.log
          echo '## Seed' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/seed.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Probe the fresh record (read mode)
        env:
          ECDYSIS_URL: ${{ steps.deploy.outputs.url }}
          STH_PUBLIC_KEY: ${{ steps.keys.outputs.log_pub }}
          MODE: read
        shell: bash
        run: |
          node --import tsx scripts/live-check.ts | tee /tmp/check.log
          echo '## Staging check' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/check.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Staging: ${{ steps.deploy.outputs.url || 'not deployed' }}"
            echo ""
            echo "**Share this address with the team.** Sign in at \`${{ steps.deploy.outputs.url }}/staging/door?key=<the door key>&email=<your address>\`."
            echo ""
            echo "- Database: ecdysis-staging, wiped and migrated."
            echo "- Log key: \`${{ steps.keys.outputs.log_pub }}\` (public half; the private half is the staging Worker's secret and was never printed)."
            echo "- Operator key: \`${{ steps.keys.outputs.op_pub }}\` (used once, for genesis; its private half is gone)."
            echo "- Staging door: ${door:-unknown}."
            echo "- Nothing to copy anywhere: later deploys and previews find the database by name and the keys on the Worker."
          } >> "$GITHUB_STEP_SUMMARY"
