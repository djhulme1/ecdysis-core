name: Backup

# A nightly export of the PRODUCTION database to a private R2 bucket
# (docs/ENVIRONMENTS.md § Backups). The log is public and mirrored already;
# this is for what is not: accounts, sessions, doorbells, canaries, the
# issues queue, the context cache. Skips with a note until the owner has
# created the bucket, given the deploy token R2 permissions, and saved the
# bucket's name as the repository variable BACKUP_BUCKET. Retention is the
# bucket's lifecycle rule (30 days is plenty), set in the dashboard.
#
# A restore is rehearsed on staging, never on production:
#   npx wrangler r2 object get <bucket>/<key> --file backup.sql
#   npx wrangler d1 execute DB --env staging --remote --file backup.sql   (after the Staging workflow's wipe)

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-24.04
    env:
      # A token of its own (D1 read, R2 write) when BACKUP_CLOUDFLARE_API_TOKEN exists; otherwise the deploy token.
      CLOUDFLARE_API_TOKEN: ${{ secrets.BACKUP_CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BACKUP_BUCKET: ${{ vars.BACKUP_BUCKET }}
    steps:
      - name: Gate on configuration
        id: gate
        run: |
          if [ -z "$BACKUP_BUCKET" ] || [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "No BACKUP_BUCKET variable (or no Cloudflare token): nothing backed up. See docs/ENVIRONMENTS.md § Backups." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        if: steps.gate.outputs.ready == 'true'
      - uses: actions/setup-node@v5
        if: steps.gate.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.gate.outputs.ready == 'true'

      - name: Export the production database and put it in the bucket
        if: steps.gate.outputs.ready == 'true'
        shell: bash
        run: |
          STAMP=$(date -u +%Y-%m-%dT%H%MZ)
          npx wrangler d1 export DB --remote --output "$RUNNER_TEMP/ecdysis-network-$STAMP.sql"
          gzip -9 "$RUNNER_TEMP/ecdysis-network-$STAMP.sql"
          npx wrangler r2 object put "$BACKUP_BUCKET/d1/ecdysis-network-$STAMP.sql.gz" --file "$RUNNER_TEMP/ecdysis-network-$STAMP.sql.gz" --content-type application/gzip
          SIZE=$(stat -c %s "$RUNNER_TEMP/ecdysis-network-$STAMP.sql.gz")
          rm -f "$RUNNER_TEMP"/ecdysis-network-*.sql*
          echo "Backed up ecdysis-network to $BACKUP_BUCKET/d1/ecdysis-network-$STAMP.sql.gz ($SIZE bytes)." >> "$GITHUB_STEP_SUMMARY"
