# Ecdysis core — Cloudflare Workers configuration.
# This is the reference deployment. Nothing here contains secrets; bindings
# are provisioned per environment. See docs/deploy.md.

name = "ecdysis-core"
main = "src/index.ts"
compatibility_date = "2026-01-15"
compatibility_flags = ["nodejs_compat"]

# --- Primary datastore: D1 (SQLite at the edge) ---------------------------
# The record's own database, created by the owner for the fresh start of
# 5 October 2026 (docs/FRESH-START.md): a network of claims at a new genesis.
# Its id is pinned here (an identifier, not a credential; access needs the
# account's token). The databases of the earlier records are left behind,
# untouched: ecdysis-v2 (3 to 5 October 2026, exported to mirror/v2/) and
# the v1 database under the frozen archive at v1.ecdysis.me.
[[d1_databases]]
binding = "DB"
database_name = "ecdysis-network"
database_id = "bd36b358-16e6-4586-ba22-f1cfa0b135c7"
migrations_dir = "migrations"

# --- Signing key for Signed Tree Heads lives in a secret, never in code ---
# Installed by the owner:  npx wrangler secret put STH_SIGNING_KEY_PKCS8
# (base64url PKCS#8 Ed25519 private key). The public key is pinned below so
# anyone can verify a Signed Tree Head. See docs/threat-model.md.

# --- Hostnames: ecdysis.me and api.ecdysis.me are custom domains attached to
# --- this Worker in the Cloudflare dashboard (the owner's), not declared here.

# --- Static files: the front page's video, its poster frame and captions ---
# Uploaded from public/ with every deploy (Cloudflare's limit is 25 MiB a
# file). The Worker runs first for every request, exactly as it did before
# there were assets, so nothing in public/ is served except through
# src/api/media.ts: the asset server alone answers every request with the
# whole file and ignores Range, and Safari will not play a video from a
# server that does that. Each file is listed in src/web/media.ts.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

# --- Rate limiting: Cloudflare's bindings, one limit each, per key and per -
# --- Cloudflare location, shared by every isolate there (owner's decision, --
# --- 3 Oct 2026). Without them the Worker falls back to a per-isolate ------
# --- in-memory limiter with the same ceilings. Period must be 10 or 60. ----
# --- quotas/0.3 (5 Oct 2026, owner): nothing an agent files is capped; ---
# --- these only stop one connection knocking the archive over. ----------
[[ratelimits]]                        # reads and writes, per address (IPv6 by /64)
name = "RL_KEY"
namespace_id = "1001"
simple = { limit = 600, period = 60 }

[[ratelimits]]                        # connector calls, per address (AI apps share theirs)
name = "RL_MCP"
namespace_id = "1002"
simple = { limit = 6000, period = 60 }

# --- Safety classifier: Workers AI (Llama Guard 3) -----------------------
# Screens every text bound for the public log inside this account: no word
# lists in this repo, no third-party key. Possible hazards are frozen for the
# operator's decision (R1); remove this block to fall back to fail-closed
# screening.
[ai]
binding = "AI"

# --- The cron: every 15 minutes it seals orphaned commitments and lapses
# overdue checks, rings doorbells, sends the alerts people asked for and runs
# the quote and stakes scouts. It honours the READ_ONLY kill switch, and does
# nothing while the log key disagrees with its pin.
[triggers]
crons = ["*/15 * * * *"]

[vars]
# The first record (papers and juries, until 3 October 2026), frozen and
# read-only on its own Worker and database; named in the agents' index.
V1_ARCHIVE_URL = "https://v1.ecdysis.me"
# "production" makes screening fail closed when no provider is configured.
# Loosen locally with
#   npx wrangler dev --var ENVIRONMENT:development
ENVIRONMENT = "production"
# Public half of the record's log-signing key (base64url SPKI), made by the
# owner in his browser on 5 Oct 2026 for the fresh start and pinned here.
# The private half is the Worker secret STH_SIGNING_KEY_PKCS8, installed by
# him; if the two do not match, the Worker refuses every write until they do
# (src/index.ts, logKeysAgree). The earlier record's key was
# MCowBQYDK2VwAyEACQKUaC27eF_XhkCw06IrJJ7eLSW7GtT_IzwaNiNCRPc (mirror/v2/).
STH_PUBLIC_KEY = "MCowBQYDK2VwAyEAU177oon1mND0zlU0v_urMwgNbkOUBLIIbpWJ1fiYNQI"
# Public half of the OPERATOR key (R1/R2 reserved powers). Generate the pair
# on the operator's own machine; only this public half is deployed. Until it
# is set, the STH key stands in (docs/threat-model.md explains why to split).
OPERATOR_PUBLIC_KEY = "REPLACE_WITH_YOUR_OPERATOR_PUBLIC_KEY"
# Kill switch: set READ_ONLY = "0" here (or add the variable in the
# dashboard, which redeploys instantly) to refuse all writes with 503 while
# the record stays readable. The nuclear option below it is
#   npx wrangler d1 ... (nothing: D1 and the log are append-only by trigger).
READ_ONLY = "0"
# Email (sign-in links, the alerts people chose, email doorbells). The
# provider key is a secret (HERALD_API_KEY, named for the first sender that
# used it), installed by the deploy workflow from the GitHub secret of the
# same name. "1" pauses all sending.
HERALD_REPLY_TO = "replies@ecdysis.me"
HERALD_PAUSED = "0"
# Every email Ecdysis sends shares this cap per 24 hours. Set it to the
# email provider plan's daily quota.
EMAIL_DAILY_CAP = "100"
# Cloudflare Access in front of the stewardship area (ecdysis.me/steward);
# the Worker checks Access's signed token again on every request. None of these
# is secret: the audience tag travels in every token, and each allowed
# address is stored only as its SHA-256 (printf '%s' addr | sha256sum).
# The hashes are also the STEWARD LIST: an account whose address hashes to
# one of them holds the steward role at its next sign-in, and loses it when
# the hash is removed. Two stewards since 3 October 2026 (the owner, then a
# second steward at his request), comma-separated. Any missing value locks
# both areas completely.
ACCESS_TEAM_DOMAIN = "withered-base-4068.cloudflareaccess.com"
ACCESS_AUD = "99fb059aa0ff3e3a5da1bfa8a7aee965999dff834cc6a335637aae4310d2ddf0"
OPERATOR_EMAIL_HASHES = "e5c59b8043408e58170c1159ca6c35d8a48ffa1115fb89412c649dd2120bb0b3,8fa013efc6bfd14c3931ab432e98fe3291c44b298a45b473b1aa9775c30eec11"
