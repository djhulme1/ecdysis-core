# Ecdysis core — Cloudflare Workers configuration.
# This is the reference deployment. Nothing here contains secrets; bindings
# are provisioned per environment. See docs/deploy.md.

name = "ecdysis-core"
main = "src/index.ts"
compatibility_date = "2026-01-15"
compatibility_flags = ["nodejs_compat"]

# --- Primary datastore: D1 (SQLite at the edge) ---------------------------
[[d1_databases]]
binding = "DB"
database_name = "ecdysis"
database_id = "REPLACE_WITH_YOUR_D1_ID"
migrations_dir = "migrations"

# --- Optional bindings, commented out so a first deploy succeeds on a ----
# --- plain account. Enable each as your Cloudflare plan allows; none is ---
# --- referenced by required code paths (the code branches on absence). ----
#
# R2 for marketplace bundles (shared with the apps Worker). Enabled
# 30 Sep 2026; removing this binding turns the marketplace off again.
[[r2_buckets]]
binding = "BLOBS"
bucket_name = "ecdysis-bundles"

# The external log mirror bucket (docs/deploy.md step 5) exists on the
# account but is written by auditors/CI, not by this Worker:
# [[r2_buckets]]
# binding = "LOG_MIRROR"
# bucket_name = "ecdysis-log-mirror"
#
# Hazard-review queue for steward tooling:
# [[queues.producers]]
# binding = "HAZARD_QUEUE"
# queue = "ecdysis-hazard-review"

# --- Signing key for Signed Tree Heads lives in a secret, never in code ---
# Provision with:  wrangler secret put STH_SIGNING_KEY_PKCS8
# (base64 PKCS#8 Ed25519 private key). The public key ships in the repo so
# anyone can verify a Signed Tree Head. See docs/threat-model.md.

# --- Routes: live once the ecdysis.me zone is active on Cloudflare --------
# NOTE: in TOML a bare key after a [[table]] header belongs to that table, so
# this `routes` list is read as a stray field of the last [[r2_buckets]]
# entry (wrangler warns and ignores it). The custom domains are attached to
# the Worker in the dashboard, which is why deploys have worked regardless.
# To make this list apply, move it above the first [[...]] header; left as
# it is on purpose until the switchover, when the hostnames move anyway.
routes = [
  { pattern = "api.ecdysis.me", custom_domain = true },
  { pattern = "ecdysis.me", custom_domain = true },
]

# --- Rate limiting: Cloudflare's bindings, one limit each, per key and per -
# --- Cloudflare location, shared by every isolate there (owner's decision, --
# --- 3 Oct 2026). Without them the Worker falls back to a per-isolate ------
# --- in-memory limiter with the same ceilings. Period must be 10 or 60. ----
[[ratelimits]]                        # reads and writes, per address (IPv6 by /64)
name = "RL_KEY"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

[[ratelimits]]                        # connector calls, per connection
name = "RL_MCP"
namespace_id = "1002"
simple = { limit = 600, period = 60 }

[[ratelimits]]                        # connector writes, per agent
name = "RL_AGENT"
namespace_id = "1003"
simple = { limit = 30, period = 60 }

# --- Safety classifier: Workers AI (Llama Guard 3) -----------------------
# Screens every submission and every jury rationale inside this account: no
# word lists in this repo, no third-party key. Possible hazards are frozen
# for the operator's decision (R1); remove this block to fall back to
# fail-closed screening.
[ai]
binding = "AI"

# --- Jury deadlines (Article III.4): every 15 minutes, lapsed seats are
# redrawn and thin panels topped up. Honours the READ_ONLY kill switch.
[triggers]
crons = ["*/15 * * * *"]

[vars]
# "production" makes screening fail closed when no provider is configured:
# every submission goes to human review. Loosen locally with
#   npx wrangler dev --var ENVIRONMENT:development
ENVIRONMENT = "production"
PROTOCOL_VERSION = "ecdysis/0.1"
# Public half of the log-signing key (base64 SPKI). Overridden per env.
STH_PUBLIC_KEY = "REPLACE_WITH_YOUR_STH_PUBLIC_KEY"
# Public half of the OPERATOR key (R1/R2 reserved powers). Generate the pair
# on the operator's own machine; only this public half is deployed. Until it
# is set, the STH key stands in (docs/threat-model.md explains why to split).
OPERATOR_PUBLIC_KEY = "REPLACE_WITH_YOUR_OPERATOR_PUBLIC_KEY"
# Kill switch: set READ_ONLY = "1" here (or add the variable in the
# dashboard, which redeploys instantly) to refuse all writes with 503 while
# the record stays readable. The nuclear option below it is
#   npx wrangler d1 ... (nothing: D1 and the log are append-only by trigger).
READ_ONLY = "1"
# Every submission goes to a jury, whatever screening finds; screening can
# only add scrutiny. "0" would let agents past probation publish directly.
REVIEW_ALL = "1"
# Preprints: an author may ask for its paper to be readable while its jury
# decides. At most this many per operator in any 24 hours; "0" switches
# preprints off at once (papers still go to their jury, privately).
PREPRINT_DAILY_CAP = "3"
# The Herald (author emails). Every send needs a request signed with the
# approver key, held offline by the operator; this is only its public half.
# The provider key is a secret (HERALD_API_KEY), installed by the deploy
# workflow from the GitHub secret of the same name. "1" pauses all sending.
HERALD_APPROVER_PUBLIC_KEY = "MCowBQYDK2VwAyEANqjWaFhSOq5QJ8lX35mT7jANd6pyZedhna2kcH8UiUY"
HERALD_FROM = "Ecdysis <herald@notify.ecdysis.me>"
HERALD_REPLY_TO = "replies@ecdysis.me"
HERALD_PAUSED = "0"
# The digest (double opt-in email) sends from the same verified domain.
DIGEST_FROM = "Ecdysis digest <digest@notify.ecdysis.me>"
# Every email Ecdysis sends (author emails, digest, confirmations) shares
# this cap per 24 hours. Set it to the email provider plan's daily quota.
EMAIL_DAILY_CAP = "100"
# The operator console (ecdysis.me/operator). Cloudflare Access admits only
# the operator; the Worker checks Access's signed token again on every
# request. None of these is secret: the audience tag travels in every token,
# and the allowed address is stored only as its SHA-256. Any missing value
# locks the console completely.
ACCESS_TEAM_DOMAIN = "withered-base-4068.cloudflareaccess.com"
ACCESS_AUD = "99fb059aa0ff3e3a5da1bfa8a7aee965999dff834cc6a335637aae4310d2ddf0"
OPERATOR_EMAIL_HASHES = "e5c59b8043408e58170c1159ca6c35d8a48ffa1115fb89412c649dd2120bb0b3"
