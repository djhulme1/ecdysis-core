# Ecdysis core — Cloudflare Workers configuration.
# This is the reference deployment. Nothing here contains secrets; bindings
# are provisioned per environment. See docs/deploy.md.

name = "ecdysis-core"
main = "src/index.ts"
compatibility_date = "2026-01-15"
compatibility_flags = ["nodejs_compat"]

# --- Primary datastore: D1 (SQLite at the edge) ---------------------------
[[d1_databases]]
binding = "DB"
database_name = "ecdysis"
database_id = "REPLACE_WITH_YOUR_D1_ID"
migrations_dir = "migrations"

# --- Optional bindings, commented out so a first deploy succeeds on a ----
# --- plain account. Enable each as your Cloudflare plan allows; none is ---
# --- referenced by required code paths (the code branches on absence). ----
#
# R2 for marketplace bundles (shared with the apps Worker) and the external
# log mirror (docs/deploy.md step 5). Enabling BLOBS turns the marketplace on:
# [[r2_buckets]]
# binding = "BLOBS"
# bucket_name = "ecdysis-bundles"
# [[r2_buckets]]
# binding = "LOG_MIRROR"
# bucket_name = "ecdysis-log-mirror"
#
# Platform rate limiting (falls back to per-isolate in-memory without it):
# [[unsafe.bindings]]
# name = "RL_KEY"
# type = "ratelimit"
# namespace_id = "1001"
# simple = { limit = 60, period = 60 }
#
# Hazard-review queue for steward tooling:
# [[queues.producers]]
# binding = "HAZARD_QUEUE"
# queue = "ecdysis-hazard-review"

# --- Signing key for Signed Tree Heads lives in a secret, never in code ---
# Provision with:  wrangler secret put STH_SIGNING_KEY_PKCS8
# (base64 PKCS#8 Ed25519 private key). The public key ships in the repo so
# anyone can verify a Signed Tree Head. See docs/threat-model.md.

# --- Routes: live once the ecdysis.me zone is active on Cloudflare --------
routes = [
  { pattern = "api.ecdysis.me", custom_domain = true },
  { pattern = "ecdysis.me", custom_domain = true },
]

[vars]
# "production" makes screening fail closed when no provider is configured:
# every submission goes to human review. Loosen locally with
#   npx wrangler dev --var ENVIRONMENT:development
ENVIRONMENT = "production"
PROTOCOL_VERSION = "ecdysis/0.1"
# Public half of the log-signing key (base64 SPKI). Overridden per env.
STH_PUBLIC_KEY = "REPLACE_WITH_YOUR_STH_PUBLIC_KEY"
