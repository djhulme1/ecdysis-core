# The frozen v1 record: Ecdysis as it stood at the switchover to v2, kept
# readable for as long as the domain lasts (docs/v2/SWITCHOVER.md).
#
# Deployed ONCE by the "Freeze v1" workflow from main's final v1 commit, as a
# separate Worker (ecdysis-v1) on the OLD database. Every page and endpoint
# keeps answering; every write is refused by the kill switch; the Signed
# Tree Head is the FINAL one, served verbatim with its final timestamp and
# signature, so the archive needs no private key at all and the head
# verifies for ever against the pinned public key. Nothing here is a
# secret; placeholders are patched by the workflow from repository
# variables, exactly as the Deploy workflow patches wrangler.toml.
#
# The hostname (v1.ecdysis.me) is declared below as a custom domain.

name = "ecdysis-v1"
main = "src/index.ts"
compatibility_date = "2026-01-15"
compatibility_flags = ["nodejs_compat"]

# The archive's hostname, as a custom domain: wrangler creates the DNS record
# and the certificate on the ecdysis.me zone at deploy (the owner asked the
# session to attach it, 3 Oct 2026). Declared here, above the first [[table]]
# header, so TOML reads it as the top-level key it is.
routes = [
  { pattern = "v1.ecdysis.me", custom_domain = true },
]

# The v1 database, read-only from here on (append-only by trigger, and the
# kill switch refuses every write before it reaches the store).
[[d1_databases]]
binding = "DB"
database_name = "ecdysis"
database_id = "REPLACE_WITH_YOUR_D1_ID"
migrations_dir = "migrations"

# Marketplace bundles of the v1 record, still downloadable from the archive.
[[r2_buckets]]
binding = "BLOBS"
bucket_name = "ecdysis-bundles"

# No cron: nothing is left to enforce on a frozen record, and the handler
# returns at once under READ_ONLY in any case. No Workers AI: nothing is
# screened, because nothing is submitted.

[vars]
ENVIRONMENT = "production"
PROTOCOL_VERSION = "ecdysis/0.1"
# The v1 log key's public half: what the final head verifies against.
STH_PUBLIC_KEY = "REPLACE_WITH_YOUR_STH_PUBLIC_KEY"
OPERATOR_PUBLIC_KEY = "REPLACE_WITH_YOUR_OPERATOR_PUBLIC_KEY"
# Frozen: every write answers 503; the record stays readable.
READ_ONLY = "1"
# The final signed tree head, as JSON, served verbatim at /v1/log/sth.
FINAL_STH = '''REPLACE_WITH_FINAL_STH'''
REVIEW_ALL = "1"
PREPRINT_DAILY_CAP = "0"
HERALD_PAUSED = "1"
HERALD_FROM = "Ecdysis <herald@notify.ecdysis.me>"
HERALD_REPLY_TO = "replies@ecdysis.me"
DIGEST_FROM = "Ecdysis digest <digest@notify.ecdysis.me>"
EMAIL_DAILY_CAP = "0"
