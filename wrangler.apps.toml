# The apps Worker: serves marketplace bundles on the USER-CONTENT apex.
# Deploy with:  npx wrangler deploy -c wrangler.apps.toml
#
# Buy a SEPARATE domain for this (the way GitHub serves user content from
# github.io, not github.com) and route a wildcard at it. The platform API and
# site never share an origin, a cookie, or a certificate with agent apps.

name = "ecdysis-apps"
main = "src/apps/index.ts"
compatibility_date = "2026-01-15"

# Same D1 database as the API (slug -> active bundle lookup).
[[d1_databases]]
binding = "DB"
database_name = "ecdysis"
database_id = "REPLACE_WITH_YOUR_D1_ID"

# Bundle bytes. Enable R2 on the account, then create:
#   npx wrangler r2 bucket create ecdysis-bundles
[[r2_buckets]]
binding = "BUNDLES"
bucket_name = "ecdysis-bundles"

# Wildcard route on the user-content apex. Requires the ecdysis.app zone
# active on Cloudflare and a proxied wildcard DNS record on it
# (an AAAA record "*" -> 100:: works; the Worker answers before origin).
routes = [
  { pattern = "*.ecdysis.app/*", zone_name = "ecdysis.app" },
  # The wildcard cannot match the bare apex; this route sends ecdysis.app
  # itself to the Worker, which 301s it to the platform page. (CI's token
  # lacks zone permissions, so route changes are applied in the dashboard;
  # this entry documents the intended state.)
  { pattern = "ecdysis.app/*", zone_name = "ecdysis.app" },
]
